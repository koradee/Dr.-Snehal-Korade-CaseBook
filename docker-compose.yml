version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: casebook_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: casebook_db
      POSTGRES_USER: casebook_user
      POSTGRES_PASSWORD: casebook_local_pw
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casebook_user -d casebook_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: casebook_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: casebook_minio_user
      MINIO_ROOT_PASSWORD: casebook_minio_pw
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console (web UI)
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  postgres_data:
  minio_data:
